name: Vulnerability Scan & Auto-Fix PR

on:
  push:
    branches:
      - main         
    paths:
      - '**.py'       
      
permissions:
  contents: write
  pull-requests: write

jobs:
  scan-and-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: |
          pip install --upgrade pip
          pip install scopefix       

      - name: Run vulnerability scanner
        env:
          DIGITALOCEAN_INFERENCE_KEY: ${{secrets.DIGITALOCEAN_INFERENCE_KEY}}
        run: |
          mkdir -p scan_results
          # Build a manifest mapping result JSON -> source file path
          echo "{}" > scan_results/manifest.json

          python - <<'EOF'
          import subprocess, json, os, pathlib

          manifest = {}
          py_files = [
              str(p) for p in pathlib.Path(".").rglob("*.py")
              if ".git" not in p.parts
          ]

          for i, source_path in enumerate(py_files):
              result_path = f"scan_results/result_{i}.json"
              manifest[result_path] = source_path

              print(f"Scanning {source_path} ...")
              with open(result_path, "w") as out:
                  subprocess.run(
                      ["scopefix", source_path],  # <-- change this
                      stdout=out,
                      stderr=subprocess.STDOUT
                  )

          with open("scan_results/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)

          print(f"\nScanned {len(py_files)} file(s).")
          EOF

      - name: Check for fix
        id: check_fix
        run: |
          HAS_FIX=$(python - <<'EOF'
          import json, glob

          with open("scan_results/manifest.json") as f:
              manifest = json.load(f)

          for result_path in manifest:
              try:
                  with open(result_path) as f:
                      if "code" in json.load(f):
                          print("true")
                          exit()
              except Exception:
                  pass

          print("false")
          EOF
          )
          echo "has_fix=$HAS_FIX" >> "$GITHUB_OUTPUT"

      - name: Apply fixes
        if: steps.check_fix.outputs.has_fix == 'true'
        run: |
          python - <<'EOF'
          import json

          with open("scan_results/manifest.json") as f:
              manifest = json.load(f)

          fixed = []
          for result_path, source_path in manifest.items():
              try:
                  with open(result_path) as f:
                      data = json.load(f)
                  if "code" in data:
                      with open(source_path, "w") as f:
                          f.write(data["code"])
                      fixed.append(source_path)
                      print(f"Fixed: {source_path}")
              except Exception as e:
                  print(f"Skipped {source_path}: {e}")

          print(f"\n{len(fixed)} file(s) fixed.")
          EOF

      - name: Create Pull Request
        if: steps.check_fix.outputs.has_fix == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix: auto-fix security vulnerabilities detected by bandit"
          branch: auto-fix/vulnerability-patch-${{ github.run_number }}
          base: main                 
          title: "🔒 Auto-fix: Security vulnerabilities detected"
          body: |
            ## Automated Security Fix

            Vulnerabilities were detected and fixed by **scopefix** on commit `${{ github.sha }}`.

            This PR contains automatically generated fixes for all affected files.
            Please review the changes before merging.

            > Generated by the `vulnerability-scan` workflow — run #${{ github.run_number }}
          labels: |
            security
            automated pr
          draft: false